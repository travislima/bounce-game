<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jumper Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0f0e17;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    #gameContainer {
      position: relative;
    }

    canvas {
      display: block;
      border: 2px solid #ff8906;
      border-radius: 8px;
      background: #0f0e17;
    }

    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(15, 14, 23, 0.9);
      color: #fffffe;
      border-radius: 8px;
    }

    #overlay h1 {
      font-size: 2.8rem;
      margin-bottom: 0.5rem;
      color: #ff8906;
    }

    #overlay p {
      font-size: 1.1rem;
      margin-bottom: 0.4rem;
      color: #a7a9be;
    }

    #overlay .final-score {
      font-size: 1.6rem;
      margin: 0.8rem 0;
      color: #fffffe;
      font-weight: bold;
    }

    #overlay .high-score {
      font-size: 1rem;
      margin-bottom: 1rem;
      color: #e53170;
    }

    #overlay button {
      padding: 0.8rem 2.5rem;
      font-size: 1.1rem;
      border: none;
      border-radius: 6px;
      background: #ff8906;
      color: #0f0e17;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s, transform 0.1s;
    }

    #overlay button:hover {
      background: #e07800;
      transform: scale(1.05);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas" width="480" height="700"></canvas>
    <div id="overlay">
      <h1>Jumper</h1>
      <p>Use arrow keys or A/D to move.</p>
      <p>Jump on platforms to climb higher!</p>
      <button id="startBtn">Start Game</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
