<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bounce Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    #gameContainer {
      position: relative;
    }

    canvas {
      display: block;
      border: 2px solid #e94560;
      border-radius: 4px;
      background: #16213e;
    }

    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(22, 33, 62, 0.85);
      color: #eee;
      border-radius: 4px;
    }

    #overlay h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      color: #e94560;
    }

    #overlay p {
      font-size: 1.1rem;
      margin-bottom: 1.5rem;
      color: #ccc;
    }

    #overlay .score-display {
      font-size: 1.3rem;
      margin-bottom: 1rem;
      color: #0f3460;
      background: #e94560;
      padding: 0.3rem 1rem;
      border-radius: 4px;
      font-weight: bold;
    }

    #overlay button {
      padding: 0.7rem 2rem;
      font-size: 1.1rem;
      border: none;
      border-radius: 4px;
      background: #e94560;
      color: white;
      cursor: pointer;
      transition: background 0.2s;
    }

    #overlay button:hover {
      background: #c73650;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="overlay">
      <h1>Bounce Game</h1>
      <p>Break all the bricks! Use arrow keys or mouse to move the paddle.</p>
      <button id="startBtn">Start Game</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
